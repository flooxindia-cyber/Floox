name: Ensure marketplace scripts are loaded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure marketplace scripts are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'floox-dashboard-fan.html',
              'floox-dashboard-artist.html',
              'floox-dashboard-organiser.html',
              'floox-organiser-profile.html',
              'floox-search-results.html',
              'floox-platform.html',
              'floox-public.html',
          ]
          tags = [
              '<script src="floox-marketplace.js"></script>',
              '<script src="floox-marketplace-enhancements.js"></script>',
          ]
          changed = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              for tag in tags:
                  if tag not in text:
                      marker = '</body>'
                      if marker in text:
                          text = text.replace(marker, f'  {tag}\n{marker}', 1)
                      else:
                          text += f'\n{tag}\n'
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(name)
          print('Changed:', changed)
          PY

      - name: Commit changes
        run: |
          git config user.name 'Floox Automation'
          git config user.email 'actions@github.com'
          git add floox-dashboard-fan.html floox-dashboard-artist.html floox-dashboard-organiser.html floox-organiser-profile.html floox-search-results.html floox-platform.html floox-public.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Ensure marketplace enhancements load [skip ci]'
          git push
