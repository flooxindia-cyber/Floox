name: Polish search planner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Polish planner UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('floox-search-results.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* FLOOX PLANNER POLISH */'
          if marker in s:
              print('Planner polish already applied')
              raise SystemExit(0)

          css = r'''\n<style>\n/* FLOOX PLANNER POLISH */\n.floox-planner{\n  width:min(1100px,100%);\n  margin:46px auto 0;\n  padding:0 2px;\n  text-align:left;\n}\n.floox-planner h2,.floox-planner h3{\n  font-family:'Clash Display',sans-serif;\n  color:#fff;\n  letter-spacing:-.7px;\n}\n.floox-planner h2{font-size:clamp(1.65rem,3vw,2.2rem);line-height:1.05;margin:0 0 4px}\n.floox-planner p{color:var(--muted);line-height:1.55}\n.floox-planner form{\n  display:grid;\n  grid-template-columns:repeat(6,minmax(0,1fr));\n  gap:10px;\n  align-items:stretch;\n  margin-top:12px;\n}\n.floox-planner form>*{min-width:0}\n.floox-planner label{\n  display:flex;\n  flex-direction:column;\n  justify-content:flex-end;\n  gap:6px;\n  color:rgba(255,255,255,.48);\n  font-size:.66rem;\n  font-weight:800;\n  letter-spacing:.05em;\n  text-transform:uppercase;\n}\n.floox-planner input,\n.floox-planner select,\n.floox-planner textarea{\n  width:100%;\n  min-height:46px;\n  padding:11px 13px;\n  border:1px solid rgba(255,255,255,.13);\n  border-radius:12px;\n  outline:0;\n  background:rgba(255,255,255,.055);\n  color:#fff;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);\n  transition:border-color .2s,box-shadow .2s,background .2s;\n}\n.floox-planner input::placeholder,.floox-planner textarea::placeholder{color:rgba(255,255,255,.34)}\n.floox-planner select option{background:#1b1007;color:#fff}\n.floox-planner input:focus,.floox-planner select:focus,.floox-planner textarea:focus{\n  border-color:rgba(255,92,0,.65);\n  background:rgba(255,255,255,.075);\n  box-shadow:0 0 0 3px rgba(255,92,0,.09);\n}\n.floox-planner input[type=date]{color-scheme:dark}\n.floox-planner textarea{min-height:46px;resize:vertical}\n.floox-planner button,.floox-planner input[type=submit]{\n  align-self:end;\n  min-height:46px;\n  padding:0 18px;\n  border:0;\n  border-radius:12px;\n  background:linear-gradient(135deg,var(--o),var(--p));\n  color:#fff;\n  font-size:.78rem;\n  font-weight:900;\n  white-space:nowrap;\n  box-shadow:0 7px 20px rgba(255,92,0,.24);\n  transition:transform .2s,box-shadow .2s;\n}\n.floox-planner button:hover,.floox-planner input[type=submit]:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(255,92,0,.32)}\n.floox-planner textarea,.floox-planner form>*:has(textarea){grid-column:span 4}\n.floox-planner form>*:has(textarea)+*{grid-column:span 2}\n@media(max-width:900px){\n  .floox-planner form{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .floox-planner textarea,.floox-planner form>*:has(textarea),.floox-planner form>*:has(textarea)+*{grid-column:span 2}\n}\n@media(max-width:560px){\n  .floox-planner{margin-top:34px}\n  .floox-planner form{grid-template-columns:1fr}\n  .floox-planner textarea,.floox-planner form>*:has(textarea),.floox-planner form>*:has(textarea)+*{grid-column:span 1}\n}\n</style>\n'''
          s = s.replace('</style>', css + '</style>', 1)

          js = r'''\n<script>\n(function(){\n  function polishPlanner(){\n    if(document.querySelector('.floox-planner')) return true;\n    const nodes=[...document.querySelectorAll('h1,h2,h3,h4,p,div')];\n    const heading=nodes.find(el=>{\n      const t=(el.textContent||'').replace(/\\s+/g,' ').trim();\n      return t.startsWith('Plan the event, then find the talent');\n    });\n    if(!heading) return false;\n    let box=heading.parentElement;\n    if(!box) return false;\n    box.classList.add('floox-planner');\n    return true;\n  }\n  if(!polishPlanner()){\n    const observer=new MutationObserver(function(){if(polishPlanner()) observer.disconnect()});\n    observer.observe(document.documentElement,{childList:true,subtree:true});\n    setTimeout(()=>observer.disconnect(),10000);\n  }\n})();\n</script>\n'''
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit planner polish
        run: |
          git config user.name "Floox Automation"
          git config user.email "actions@github.com"
          git add floox-search-results.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish event planner form on search results"
          git push
