name: Enforce profile authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-profile-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add sign-in guard to full profiles
        shell: python
        run: |
          from pathlib import Path
          path = Path('floox-auth.js')
          text = path.read_text(encoding='utf-8')
          old = "async function showProfile(id,role){shell.classList.add('open');document.body.style.overflow='hidden';"
          new = "async function showProfile(id,role){if(!isLoggedIn()){location.href='floox-login.html?from=profile';return}shell.classList.add('open');document.body.style.overflow='hidden';"
          if old not in text:
              raise SystemExit('Target profile function was not found; refusing to modify the file.')
          if new in text:
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit profile auth fix and remove patch workflow
        run: |
          git config user.name "flooxindia-cyber"
          git config user.email "flooxindia@gmail.com"
          git add floox-auth.js
          git rm .github/workflows/patch-profile-auth.yml
          git diff --cached --quiet || git commit -m "Require sign in before full artist and organiser profiles"
          git push
