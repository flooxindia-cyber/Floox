<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile — Floox</title>
<link rel="icon" href="logo_floox.jpeg">
<meta name="theme-color" content="#100a02">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:#100a02;color:#fff;font-family:'Cabinet Grotesk',sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}
:root{--o:#ff5c00;--p:#ff2d78;--y:#ffd600;--t:#00c2a8;--v:#7c3aed;--bg:#100a02;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--muted:rgba(255,255,255,.58);--dim:rgba(255,255,255,.32)}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 15%,rgba(255,92,0,.12),transparent 27%),radial-gradient(circle at 85% 25%,rgba(124,58,237,.12),transparent 30%),linear-gradient(145deg,#0e0801,#160d04 55%,#0d0800)}
.nav{height:70px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(16,10,2,.9);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:38px;height:38px;border-radius:11px;object-fit:cover}.logo b{font-family:'Clash Display';font-size:1.35rem;background:linear-gradient(135deg,#ffd600,#ff5c00,#ff2d78);-webkit-background-clip:text;color:transparent}
.nav-right{display:flex;gap:8px;align-items:center}.nav-btn{border:1px solid var(--line);border-radius:100px;padding:8px 15px;color:var(--muted);font-size:.78rem;font-weight:800;background:transparent}.nav-btn:hover{border-color:var(--o);color:#fff}.nav-join{background:linear-gradient(135deg,var(--o),var(--p));color:#fff;border:0;box-shadow:0 5px 18px rgba(255,92,0,.3)}

.wrap{max-width:980px;margin:0 auto;padding:26px 5% 90px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;font-weight:800;border:0;background:none;margin-bottom:16px}.back:hover{color:#fff}

.profile-card{background:#0d1117;border:1px solid rgba(255,255,255,.12);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.cover{height:240px;position:relative;background:linear-gradient(135deg,rgba(255,92,0,.3),rgba(255,45,120,.18),rgba(124,58,237,.25))}
.cover img{width:100%;height:100%;object-fit:cover;opacity:.55;filter:blur(2px)}
.avatar{position:absolute;left:34px;bottom:-52px;width:112px;height:112px;border-radius:50%;border:4px solid #0d1117;background:linear-gradient(135deg,var(--o),var(--p));display:grid;place-items:center;font-family:'Clash Display';font-size:2.4rem;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;opacity:1;filter:none}
.body{padding:70px 34px 34px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.name{font-family:'Clash Display';font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;letter-spacing:-1px;line-height:1.05}
.chip{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#39e6ca}
.sub{margin-top:8px;color:var(--muted);font-size:.85rem;font-weight:700}
.verified{border-radius:100px;padding:6px 12px;background:rgba(0,194,168,.14);border:1px solid rgba(0,194,168,.3);color:#39e6ca;font-size:.7rem;font-weight:900}

.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.primary{flex:1;min-width:200px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--o),var(--p));color:#fff;font-weight:900;text-align:center;box-shadow:0 8px 24px rgba(255,92,0,.3)}
.secondary{border:1px solid var(--line);border-radius:14px;padding:14px 22px;background:transparent;color:#fff;font-weight:800}
.secondary:hover{border-color:var(--o)}

.section{margin-top:30px}
.section h2{display:flex;align-items:center;gap:9px;color:var(--muted);font-family:'Clash Display';font-size:1rem;font-weight:700;margin-bottom:12px}
.section h2:before{content:"";width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--o),var(--p))}
.bio{font-size:.92rem;color:rgba(255,255,255,.78);line-height:1.85;white-space:pre-line}
.bio.empty{color:var(--dim);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.meta-box{padding:13px 14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:14px}
.meta-box small{display:block;color:var(--dim);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
.meta-box span{display:block;font-size:.85rem;font-weight:700;margin-top:3px;word-break:break-word}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{padding:6px 12px;border-radius:100px;font-size:.72rem;font-weight:800;color:#ff8a4a;background:rgba(255,92,0,.1);border:1px solid rgba(255,92,0,.25)}

.contact{padding:16px;border:1px solid rgba(0,194,168,.18);background:rgba(0,194,168,.05);border-radius:16px;font-size:.85rem;line-height:2}
.nudge{padding:18px;border:1px dashed rgba(255,92,0,.25);background:rgba(255,92,0,.05);border-radius:16px;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.7}
.nudge a{color:#ff8a4a;font-weight:900}

.state{padding:90px 20px;text-align:center;color:var(--muted)}
.state .ic{font-size:3rem}.state h3{font-family:'Clash Display';font-size:1.4rem;color:#fff;margin:10px 0 6px}
.state a{display:inline-block;margin-top:16px;border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-weight:800;color:#fff}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9000;background:#1b1007;border:1px solid rgba(255,92,0,.35);padding:10px 16px;border-radius:100px;font-size:.78rem;font-weight:800;box-shadow:0 10px 35px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}

@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.body{padding:66px 20px 26px}.avatar{left:20px;width:96px;height:96px;bottom:-46px}.cover{height:190px}.nav-btn:not(.nav-join){display:none}}
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="floox-public.html"><img src="logo_floox.jpeg" alt="Floox"><b>Floox</b></a>
  <div class="nav-right">
    <a class="nav-btn" href="floox-search-results.html">Discover</a>
    <a class="nav-btn" href="floox-login.html" id="navLogin">Sign In</a>
    <a class="nav-btn nav-join" href="floox-login.html" id="navJoin">Join Free</a>
  </div>
</header>

<main class="wrap">
  <button class="back" onclick="goBack()">← Back to results</button>
  <div id="root"><div class="state"><div class="ic">✦</div><h3>Loading profile…</h3></div></div>
</main>

<div class="toast" id="toast"></div>

<script src="floox-auth.js"></script>
<script>
const logged=()=>!!localStorage.getItem('floox_token')&&!!localStorage.getItem('floox_user');
const token=()=>localStorage.getItem('floox_token')||'';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(name){return esc(String(name||'F').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}
async function getJSON(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function goBack(){if(document.referrer&&document.referrer.includes(location.host)&&history.length>1)history.back();else location.href='floox-search-results.html'}

const params=new URLSearchParams(location.search);
const pid=params.get('id');
let role=params.get('role')==='organiser'?'organiser':'artist';
let likes=new Set();
let profile=null;

async function fetchProfile(){
  // Logged-in users get the full profile; guests get the public (limited) version
  if(logged()){
    const d=await getJSON('/api/get-profile?id='+encodeURIComponent(pid),{headers:{Authorization:'Bearer '+token()}});
    return d.user;
  }
  const d=role==='artist'
    ? await getJSON('/api/artists?id='+encodeURIComponent(pid)+'&limit=1')
    : await getJSON('/api/organisers?id='+encodeURIComponent(pid)+'&limit=1');
  return (role==='artist'?d.artists:d.organisers)?.[0];
}

function metaBox(label,val){return `<div class="meta-box"><small>${label}</small><span>${esc(val||'—')}</span></div>`}

function render(u){
  const isArtist=role==='artist';
  const name=u.stageName||u.orgName||u.name||'Floox profile';
  const type=isArtist?(u.performerType||'Artist'):(u.orgType||'Event Organiser');
  const genres=(u.genres||u.preferredGenres||[]);
  document.title=name+' — Floox';

  const avatar=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:initials(name);
  const cover=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:'';

  const meta=isArtist
    ? metaBox('City',u.city)+metaBox('Experience',u.experience)+metaBox('Performer type',u.performerType)+metaBox('Verification',u.verified?'✓ Verified':'Profile')
    : metaBox('City',u.city)+metaBox('Organiser type',u.orgType)+metaBox('Events / year',u.eventsPerYear)+metaBox('Verification',u.verified?'✓ Verified':'Profile');

  const signin='floox-login.html?from=profile&id='+encodeURIComponent(u.id)+'&role='+role;
  const full=logged();

  const head=`
      <div class="head">
        <div>
          <h1 class="name">${esc(name)}</h1>
          <div class="chip">${esc(type)}</div>
          <div class="sub">📍 ${esc(u.city||'India')}</div>
        </div>
        ${u.verified?'<span class="verified">✓ Verified</span>':''}
      </div>`;

  let inner;
  if(full){
    inner=head+`
      <div class="actions">
        <button class="secondary" id="followBtn" onclick="toggleFollow()">${likes.has(u.id)?'❤️ Following':'♡ Follow'}</button>
        <button class="primary" onclick="messageProfile()">✉️ ${isArtist?'Message Artist':'Send Enquiry'} →</button>
      </div>

      <section class="section"><h2>About</h2>
        <p class="bio ${u.bio?'':'empty'}">${esc(u.bio||'No bio added yet.')}</p>
      </section>

      <section class="section"><h2>Details</h2><div class="grid">${meta}</div></section>

      ${genres.length?`<section class="section"><h2>${isArtist?'Genres':'Preferred genres'}</h2><div class="tags">${genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div></section>`:''}

      <section class="section"><h2>Contact</h2>
        <div class="contact">📧 ${esc(u.email||'Not provided')}<br>📱 ${esc(u.phone||'Not provided')}${u.website?`<br>🌐 ${esc(u.website)}`:''}</div>
      </section>`;
  }else{
    inner=head+`
      <section class="section">
        <div class="nudge">🔒 Sign in to view the full profile, contact details and send a booking enquiry.<br><a href="${signin}">Sign in to Floox →</a></div>
      </section>`;
  }

  document.getElementById('root').innerHTML=`
  <article class="profile-card">
    <div class="cover">${cover}<div class="avatar">${avatar}</div></div>
    <div class="body">${inner}</div>
  </article>`;
}

async function toggleFollow(){
  if(!logged()){toast('🔒 Sign in to follow profiles');return}
  try{
    const d=await getJSON('/api/toggle-like',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({likedId:profile.id})});
    if(d.liked)likes.add(profile.id);else likes.delete(profile.id);
    document.getElementById('followBtn').textContent=d.liked?'❤️ Following':'♡ Follow';
    toast(d.liked?'❤️ Added to your likes':'🤍 Removed from your likes');
  }catch(e){toast(e.message)}
}

function messageProfile(){
  const id=profile.id;
  if(!logged()){location.href='floox-login.html?from=messages&with='+encodeURIComponent(id);return}
  const me=JSON.parse(localStorage.getItem('floox_user')||'null');
  if(me&&me.id===id){toast("You can't message yourself.");return}
  location.href='floox-messages.html?with='+encodeURIComponent(id);
}

(async function init(){
  if(!pid){showError('No profile selected','Go back and pick an artist or organiser.');return}
  // Guests: organisers API is login-only, so show the locked card without fetching anything
  if(!logged()&&role==='organiser'){renderLocked();return}
  try{
    if(logged()){try{const d=await getJSON('/api/get-likes',{headers:{Authorization:'Bearer '+token()}});likes=new Set(d.likes||[])}catch(_){}}
    let u=await fetchProfile();
    if(!u)throw new Error('Profile not found');
    profile=u;
    render(u);
  }catch(e){
    if(!logged()){renderLocked();return}
    showError('Could not load profile',e.message)
  }
})();

function renderLocked(){
  const signin='floox-login.html?from=profile&id='+encodeURIComponent(pid)+'&role='+role;
  document.getElementById('root').innerHTML=`<div class="state"><div class="ic">🔒</div><h3>Sign in to view this profile</h3><p>Create a free Floox account or sign in to see full profiles, contact details and send enquiries.</p><a href="${signin}">Sign in to Floox →</a></div>`;
}

function showError(title,msg){
  document.getElementById('root').innerHTML=`<div class="state"><div class="ic">⚠️</div><h3>${esc(title)}</h3><p>${esc(msg)}</p><a href="floox-search-results.html">← Back to Discover</a></div>`;
}
</script>
</body>
</html>
