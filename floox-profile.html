<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floox — Artist Profile</title>
  <meta http-equiv="Cache-Control" content="no-store">
  <script>
    // Backward-compatible artist profile URL.
    // The public profile implementation lives at floox-public.html.
    (function () {
      var target = new URL('floox-public.html', window.location.href);
      window.location.search = window.location.search;
      target.search = window.location.search;
      window.location.replace(target.href);
    })();
  </script>
  <style>
    html,body{margin:0;min-height:100%;background:#100a02;color:#fff;font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#ff5c00;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    p{opacity:.65}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div>
      <div class="spinner"></div>
      <p>Opening artist profile…</p>
    </div>
  </main>
</body>
</html>
