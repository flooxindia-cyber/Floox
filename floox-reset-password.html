<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password — Floox</title><link rel="stylesheet" href="floox-shared.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="width:min(520px,100%);padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.04)"><h1>Choose a new password</h1><p id="emailText" style="color:#aaa"></p><input id="otp" maxlength="6" inputmode="numeric" placeholder="6-digit code" style="width:100%;padding:14px;margin:8px 0;border-radius:12px"><input id="pw" type="password" placeholder="New password (8+ characters)" style="width:100%;padding:14px;margin:8px 0;border-radius:12px"><input id="pw2" type="password" placeholder="Confirm password" style="width:100%;padding:14px;margin:8px 0;border-radius:12px"><button id="reset" class="btn-fire" style="width:100%;margin-top:8px">Reset password</button><p id="msg" style="color:#aaa"></p></section></main><script src="floox-auth.js"></script><script>const email=new URLSearchParams(location.search).get('email')||'';document.getElementById('emailText').textContent=email;document.getElementById('reset').onclick=async()=>{const msg=document.getElementById('msg'),pw=document.getElementById('pw').value;if(pw.length<8)return msg.textContent='Password must be at least 8 characters.';if(pw!==document.getElementById('pw2').value)return msg.textContent='Passwords do not match.';try{const d=await FLOOX.resetPassword(email,document.getElementById('otp').value,pw);msg.textContent=d.message;setTimeout(()=>location.href='floox-login.html',900)}catch(e){msg.textContent=e.message}}</script></body></html>
