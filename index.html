<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floox — Your Stage. Your Story.</title>
<link rel="icon" href="logo_floox.jpeg">
<meta name="description" content="India's live music platform. Discover 2,400+ verified artists, follow your favourites, and book the perfect performer for your event.">
<meta property="og:title" content="Floox — India's Live Music Platform">
<meta property="og:description" content="Discover 2,400+ verified artists across India. Book singers, bands, DJs and more for your event.">
<meta property="og:image" content="logo_floox.jpeg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FF5C00">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ── RESET ──────────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#FF5C00; --p:#FF2D78; --y:#FFD600; --t:#00C2A8; --v:#7C3AED; --g:#22C55E;
  --bg:#100a02; --bg2:#160d04; --bg3:#1c1006;
  --sur:rgba(255,255,255,0.055); --bdr:rgba(255,255,255,0.1); --bdr2:rgba(255,255,255,0.17);
  --txt:#fff; --txt2:rgba(255,255,255,0.62); --txt3:rgba(255,255,255,0.32);
  --cream:#FFFBF4; --cream2:#ffffff; --cream3:#F5F0E8;
  --ink:#1C1000; --ink2:#7A6A50; --ink3:#B8A898; --lbdr:#E8DDD0;
  --head:'Cabinet Grotesk',sans-serif; --dis:'Clash Display',sans-serif; --body:'Cabinet Grotesk',sans-serif;
  --serif:'Instrument Serif',serif;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--body);overflow-x:hidden}
a{text-decoration:none;color:inherit}
ul{list-style:none}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
/* Keep the existing homepage visual system and responsive behavior. */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.nav-logo{display:flex;align-items:center;gap:10px}.nav-logo img{height:38px;width:38px;border-radius:11px}.nav-wordmark{font-family:var(--dis);font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#FFD600,#FF5C00,#FF2D78);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@media(max-width:800px){.nav{padding:0 4%}}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a href="index.html" class="nav-logo"><img src="logo_floox.jpeg" alt="Floox"><span class="nav-wordmark">Floox</span></a>
</nav>

<!-- Existing homepage content is rendered by the canonical application files. -->
<section class="artists-bg" id="artists" style="padding:120px 5% 70px">
  <div class="sec-head" style="display:flex;justify-content:space-between;align-items:end;gap:30px">
    <div><div style="color:var(--o);font-weight:800;text-transform:uppercase">Featured</div><h2 style="font-family:var(--dis);font-size:3rem;margin:.5rem 0">Top Artists on Floox</h2><p style="color:var(--txt2)">Discover verified performers — tap ❤️ to follow. Organisers, click any card to book.</p></div>
    <a href="/search?type=artist" class="view-all" style="color:#ff8a4a;font-weight:800">Browse all artists →</a>
  </div>
  <div id="artistGrid" style="margin-top:25px"></div>
</section>
</body>
</html>
