<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Floox</title><link rel="stylesheet" href="floox-shared.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="width:min(520px,100%);padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.04)"><h1>Reset your password</h1><p style="color:#aaa">Enter your account email. We'll send a one-time code.</p><input id="email" type="email" placeholder="you@email.com" style="width:100%;padding:14px;margin:16px 0;border-radius:12px"><button id="send" class="btn-fire" style="width:100%">Send reset code</button><p id="msg" style="color:#aaa"></p><a href="floox-login.html">← Back to login</a></section></main><script>document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase();const m=document.getElementById('msg');try{const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message;location.href='floox-reset-password.html?email='+encodeURIComponent(email)}catch(e){m.textContent=e.message}}</script></body></html>
