*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:#100a02;color:#fff;font-family:'Cabinet Grotesk',sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}

.empty{padding:70px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:3rem}.empty h3{font-family:'Clash Display';font-size:1.35rem;color:#fff;margin:10px 0 5px}.empty p{font-size:.8rem}.retry{margin-top:15px;border:1px solid var(--line);border-radius:100px;padding:8px 15px;background:transparent;color:#fff;font-weight:800}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(13px);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#0d1117;border:1px solid rgba(255,255,255,.12);border-radius:25px;box-shadow:0 30px 90px rgba(0,0,0,.5)}.modal-cover{height:180px;position:relative;background:linear-gradient(135deg,rgba(255,92,0,.25),rgba(124,58,237,.22))}.modal-cover img{width:100%;height:100%;object-fit:cover;opacity:.7}.modal-close{position:absolute;right:12px;top:12px;width:35px;height:35px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);color:#fff}.modal-avatar{position:absolute;left:22px;bottom:-34px;width:70px;height:70px;border-radius:50%;border:3px solid #0d1117;background:linear-gradient(135deg,var(--o),var(--p));display:grid;place-items:center;font-size:1.7rem;overflow:hidden}.modal-avatar img{width:100%;height:100%;object-fit:cover;opacity:1}.modal-body{padding:50px 22px 22px}.modal-name{font-family:'Clash Display';font-size:1.55rem;font-weight:700}.modal-chip{display:inline-block;margin-top:5px;font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#39e6ca}.modal-bio{font-size:.82rem;color:var(--muted);line-height:1.75;margin-top:12px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.meta-box{padding:10px 12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:12px}.meta-box small{display:block;color:var(--dim);font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.meta-box span{display:block;font-size:.76rem;font-weight:700;margin-top:2px}.modal-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}.contact{margin-top:15px;padding:13px;border:1px solid rgba(0,194,168,.18);background:rgba(0,194,168,.05);border-radius:14px;font-size:.75rem;line-height:1.8}.nudge{margin-top:15px;padding:13px;border:1px dashed rgba(255,92,0,.25);background:rgba(255,92,0,.05);border-radius:14px;text-align:center;color:var(--muted);font-size:.75rem}.nudge a{color:#ff8a4a;font-weight:900}.actions{display:flex;gap:8px;margin-top:16px}.primary{flex:1;border:0;border-radius:12px;padding:11px;background:linear-gradient(135deg,var(--o),var(--p));color:#fff;font-weight:900}.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:transparent;color:#fff;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9000;background:#1b1007;border:1px solid rgba(255,92,0,.35);padding:10px 16px;border-radius:100px;font-size:.75rem;font-weight:800;box-shadow:0 10px 35px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}

\n<style>\n/* FLOOX PLANNER POLISH */\n.floox-planner{\n  width:min(1100px,100%);\n  margin:46px auto 0;\n  padding:0 2px;\n  text-align:left;\n}\n.floox-planner h2,.floox-planner h3{\n  font-family:'Clash Display',sans-serif;\n  color:#fff;\n  letter-spacing:-.7px;\n}\n.floox-planner h2{font-size:clamp(1.65rem,3vw,2.2rem);line-height:1.05;margin:0 0 4px}\n.floox-planner p{color:var(--muted);line-height:1.55}\n.floox-planner form{\n  display:grid;\n  grid-template-columns:repeat(6,minmax(0,1fr));\n  gap:10px;\n  align-items:stretch;\n  margin-top:12px;\n}\n.floox-planner form>*{min-width:0}\n.floox-planner label{\n  display:flex;\n  flex-direction:column;\n  justify-content:flex-end;\n  gap:6px;\n  color:rgba(255,255,255,.48);\n  font-size:.66rem;\n  font-weight:800;\n  letter-spacing:.05em;\n  text-transform:uppercase;\n}\n.floox-planner input,\n.floox-planner select,\n.floox-planner textarea{\n  width:100%;\n  min-height:46px;\n  padding:11px 13px;\n  border:1px solid rgba(255,255,255,.13);\n  border-radius:12px;\n  outline:0;\n  background:rgba(255,255,255,.055);\n  color:#fff;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);\n  transition:border-color .2s,box-shadow .2s,background .2s;\n}\n.floox-planner input::placeholder,.floox-planner textarea::placeholder{color:rgba(255,255,255,.34)}\n.floox-planner select option{background:#1b1007;color:#fff}\n.floox-planner input:focus,.floox-planner select:focus,.floox-planner textarea:focus{\n  border-color:rgba(255,92,0,.65);\n  background:rgba(255,255,255,.075);\n  box-shadow:0 0 0 3px rgba(255,92,0,.09);\n}\n.floox-planner input[type=date]{color-scheme:dark}\n.floox-planner textarea{min-height:46px;resize:vertical}\n.floox-planner button,.floox-planner input[type=submit]{\n  align-self:end;\n  min-height:46px;\n  padding:0 18px;\n  border:0;\n  border-radius:12px;\n  background:linear-gradient(135deg,var(--o),var(--p));\n  color:#fff;\n  font-size:.78rem;\n  font-weight:900;\n  white-space:nowrap;\n  box-shadow:0 7px 20px rgba(255,92,0,.24);\n  transition:transform .2s,box-shadow .2s;\n}\n.floox-planner button:hover,.floox-planner input[type=submit]:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(255,92,0,.32)}\n.floox-planner textarea,.floox-planner form>*:has(textarea){grid-column:span 4}\n.floox-planner form>*:has(textarea)+*{grid-column:span 2}\n@media(max-width:900px){\n  .floox-planner form{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .floox-planner textarea,.floox-planner form>*:has(textarea),.floox-planner form>*:has(textarea)+*{grid-column:span 2}\n}\n@media(max-width:560px){\n  .floox-planner{margin-top:34px}\n  .floox-planner form{grid-template-columns:1fr}\n  .floox-planner textarea,.floox-planner form>*:has(textarea),.floox-planner form>*:has(textarea)+*{grid-column:span 1}\n}\n</style>\n</style>
</head>

<header class="nav"><a class="logo" href="floox-public.html"><img src="logo_floox.jpeg" alt="Floox"><b>Floox</b></a><div class="nav-right"><a class="nav-btn" href="floox-public.html">← Home</a><a class="nav-btn" href="floox-login.html" id="navLogin">Sign In</a><a class="nav-btn nav-join" href="floox-login.html" id="navJoin">Join Free</a></div></header>
<section class="hero"><div class="eyebrow"><span class="dot"></span> Live music, artists & events</div><h1>Discover <span>what's happening.</span></h1><p>Find verified artists, event organisers and live events across India. Profiles are updated directly from the Floox database.</p><div class="search-wrap"><form class="search-box" id="searchForm"><span class="search-icon">⌕</span><input id="q" class="search-input" placeholder="Search artists, organisers, events..." autocomplete="off"><input id="city" class="city-input" placeholder="City"><button class="search-submit">Search →</button></form></div><div class="tabs"><button class="tab active" data-type="all">Everything</button><button class="tab" data-type="artist">🎤 Artists</button><button class="tab" data-type="event">🎟 Events</button><button class="tab" data-type="organiser">🎪 Organisers</button></div></section>
<main class="content"><div class="meta"><div class="count" id="count">Loading...</div><select class="sort" id="sort"><option value="recent">Recently joined</option><option value="name">Name A–Z</option><option value="date">Event date</option></select></div><div id="results"></div></main>
<div class="modal-bg" id="profileModal"><div class="modal"><div class="modal-cover" id="pmCover"><img id="pmCoverImg" style="display:none"><button class="modal-close" onclick="closeModal()">✕</button><div class="modal-avatar" id="pmAvatar">🎤</div></div><div class="modal-body"><div class="modal-name" id="pmName"></div><div class="modal-chip" id="pmChip"></div><div class="modal-bio" id="pmBio"></div><div class="modal-grid" id="pmMeta"></div><div class="modal-tags" id="pmTags"></div><div id="pmContact"></div><div class="actions" id="pmActions"></div></div></div></div>
<div class="modal-bg" id="eventModal"><div class="modal"><div class="modal-cover"><button class="modal-close" onclick="closeEvent()">✕</button></div><div class="modal-body"><div class="modal-name" id="emName"></div><div class="modal-chip" id="emType"></div><div class="modal-bio" id="emDesc"></div><div class="modal-grid" id="emMeta"></div><div class="modal-tags" id="emTags"></div><div class="actions" id="emActions"></div></div></div></div>
<div class="toast" id="toast"></div>
<script src="floox-auth.js"></script>
<script>
const state={type:'all',q:'',city:'',artists:[],organisers:[],events:[],likes:new Set()};
const logged=()=>!!localStorage.getItem('floox_token')&&!!localStorage.getItem('floox_user');
const token=()=>localStorage.getItem('floox_token')||'';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function initials(name){return esc(String(name||'F').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}
async function getJSON(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function loadLikes(){if(!logged())return;try{const d=await getJSON('/api/get-likes',{headers:{Authorization:'Bearer '+token()}});state.likes=new Set(d.likes||[])}catch(_){} }
async function search(){state.q=document.getElementById('q').value.trim();state.city=document.getElementById('city').value.trim();document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">✦</div><h3>Searching Floox...</h3><p>Loading live database results.</p></div>';try{const qs=new URLSearchParams({q:state.q,city:state.city,limit:'50'});const jobs=[];if(state.type==='all'||state.type==='artist')jobs.push(getJSON('/api/artists?'+qs).then(x=>state.artists=x.artists||[]));else state.artists=[];if(state.type==='all'||state.type==='organiser')jobs.push(getJSON('/api/organisers?'+qs).then(x=>state.organisers=x.organisers||[]));else state.organisers=[];if(state.type==='all'||state.type==='event')jobs.push(getJSON('/api/events?'+qs).then(x=>state.events=x.events||[]));else state.events=[];await Promise.all(jobs);render()}catch(e){console.error(e);document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load results</h3><p>'+esc(e.message)+'</p><button class="retry" onclick="search()">Try again</button></div>'}}
function render(){let artists=[...state.artists],orgs=[...state.organisers],events=[...state.events];const sort=document.getElementById('sort').value;if(sort==='name'){artists.sort((a,b)=>(a.stageName||a.name).localeCompare(b.stageName||b.name));orgs.sort((a,b)=>(a.orgName||a.name).localeCompare(b.orgName||b.name))}if(sort==='date')events.sort((a,b)=>String(a.eventDate).localeCompare(String(b.eventDate)));const total=artists.length+orgs.length+events.length;document.getElementById('count').innerHTML=total?`<span>${total}</span> result${total===1?'':'s'}`:'No results found';let html='';if(artists.length){html+=`<div class="section-title">Artists <span class="badge">${artists.length}</span></div><div class="grid">`;html+=artists.map(a=>artistCard(a)).join('');html+='</div>'}if(events.length){html+=`<div class="section-title">Upcoming Events <span class="badge">${events.length}</span></div><div class="event-grid">`;html+=events.map(eventCard).join('');html+='</div>'}if(orgs.length){html+=`<div class="section-title">Organisers <span class="badge">${orgs.length}</span></div><div class="org-grid">`;html+=orgs.map(orgCard).join('');html+='</div>'}if(!html)html='<div class="empty"><div class="empty-icon">🎵</div><h3>No matches yet</h3><p>Try another name, city or category.</p></div>';document.getElementById('results').innerHTML=html}
function artistCard(a){const name=a.stageName||a.name||'Artist';const img=a.avatar?`<img src="${esc(a.avatar)}" alt="">`:`<div class="initial">${initials(name)}</div>`;const genres=(a.genres||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join('');return `<article class="card" onclick="openProfile('${esc(a.id)}','artist')"><div class="artist-photo">${img}<div class="photo-gradient"></div><span class="verify">✓ Verified</span><button class="heart" onclick="like(event,'${esc(a.id)}','${esc(name)}')">${state.likes.has(a.id)?'❤️':'♡'}</button></div><div class="artist-info"><div class="kind">${esc(a.performerType||'Artist')}</div><div class="name">${esc(name)}</div><div class="city">📍 ${esc(a.city||'India')}</div><div class="tags">${genres||'<span class="tag">New profile</span>'}</div><span class="cta">View profile →</span></div></article>`}
function orgCard(o){const name=o.orgName||o.name||'Organiser';const img=o.avatar?`<img src="${esc(o.avatar)}" alt="">`:'🎪';const tags=(o.preferredGenres||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join('');return `<article class="org-card" onclick="openProfile('${esc(o.id)}','organiser')"><div class="org-top"><div class="org-avatar">${img}</div><span class="org-verified">✓ Verified</span></div><div class="org-name">${esc(name)}</div><div class="org-type">${esc(o.orgType||'Event Organiser')} · 📍 ${esc(o.city||'India')}</div><div class="org-bio">${esc(o.bio||'Discover this organiser on Floox and view their complete profile after signing in.')}</div><div class="tags">${tags}</div><div class="org-stats">${esc(o.eventsPerYear||'—')} events/year</div></article>`}
function eventCard(e){const d=new Date(e.eventDate+'T00:00:00');const day=Number.isNaN(d.getTime())?'—':d.getDate();const mon=Number.isNaN(d.getTime())?'':d.toLocaleString('en-IN',{month:'short'});return `<article class="card event-card" onclick="openEvent('${esc(e.id)}')"><div class="event-top"><div class="event-date"><b>${day}</b><span>${mon}</span></div></div><div class="event-body"><div class="event-type">${esc(e.eventType||'Live Event')}</div><div class="event-name">${esc(e.name)}</div><div class="event-meta">📍 ${esc(e.venue||'Venue TBA')} · ${esc(e.city||'India')}<br>🗓 ${esc(e.eventDate)}</div><div class="event-genres">${(e.genres||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>${Number(e.budget)>0?`<div class="event-budget">Budget: ₹${Number(e.budget).toLocaleString('en-IN')}</div>`:''}<div class="event-org">Organised by ${esc(e.organiser?.orgName||e.organiser?.name||'Floox organiser')}</div></div></article>`}
async function openProfile(id,role){const modal=document.getElementById('profileModal');document.getElementById('pmName').textContent='Loading profile…';document.getElementById('pmChip').textContent='';document.getElementById('pmBio').textContent='';document.getElementById('pmMeta').innerHTML='';document.getElementById('pmTags').innerHTML='';document.getElementById('pmContact').innerHTML='';document.getElementById('pmActions').innerHTML='';modal.classList.add('show');try{let u;if(logged()){const d=await getJSON('/api/get-profile?id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token()}});u=d.user}else{const d=role==='artist'?await getJSON('/api/artists?id='+encodeURIComponent(id)+'&limit=1'):await getJSON('/api/organisers?id='+encodeURIComponent(id)+'&limit=1');u=(role==='artist'?d.artists:d.organisers)?.[0]}if(!u)throw new Error('Profile not found');const name=u.stageName||u.orgName||u.name||'Floox profile';document.getElementById('pmName').textContent=name;document.getElementById('pmChip').textContent=role==='artist'?(u.performerType||'Artist'):(u.orgType||'Organiser');document.getElementById('pmBio').textContent=u.bio||'No bio added yet.';document.getElementById('pmMeta').innerHTML=`<div class="meta-box"><small>City</small><span>${esc(u.city||'—')}</span></div><div class="meta-box"><small>Experience</small><span>${esc(u.experience||'—')}</span></div><div class="meta-box"><small>Genres</small><span>${esc((u.genres||u.preferredGenres||[]).slice(0,2).join(', ')||'—')}</span></div><div class="meta-box"><small>Verification</small><span>${u.verified?'✓ Verified':'Profile'}</span></div>`;document.getElementById('pmTags').innerHTML=(u.genres||u.preferredGenres||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');if(logged()){document.getElementById('pmContact').innerHTML=`<div class="contact"><b>Contact & profile details</b><br>📧 ${esc(u.email||'Not provided')}<br>📱 ${esc(u.phone||'Not provided')}${u.website?`<br>🌐 ${esc(u.website)}`:''}</div>`;document.getElementById('pmActions').innerHTML=`<button class="secondary" onclick="like(null,'${esc(u.id)}','${esc(name)}')">${state.likes.has(u.id)?'❤️ Following':'♡ Follow'}</button><button class="primary" onclick="messageProfile('${esc(u.id)}')">✉️ ${role==='artist'?'Message Artist':'Send Enquiry'} →</button>`}else{document.getElementById('pmContact').innerHTML='<div class="nudge">🔒 Sign in to view the complete profile, contact details and send a booking enquiry.<br><a href="floox-login.html">Sign in to Floox →</a></div>'}}catch(e){document.getElementById('pmName').textContent='Could not load profile';document.getElementById('pmBio').textContent=e.message}}
function closeModal(){document.getElementById('profileModal').classList.remove('show')}
function messageProfile(id){if(!logged()){location.href='floox-login.html?from=messages&with='+encodeURIComponent(id);return}const me=JSON.parse(localStorage.getItem('floox_user')||'null');if(me&&me.id===id){toast("You can't message yourself.");return}location.href='floox-messages.html?with='+encodeURIComponent(id)}
function openEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return;document.getElementById('emName').textContent=e.name;document.getElementById('emType').textContent=e.eventType||'Live Event';document.getElementById('emDesc').textContent=e.description||'No event description provided.';document.getElementById('emMeta').innerHTML=`<div class="meta-box"><small>Date</small><span>${esc(e.eventDate)}</span></div><div class="meta-box"><small>Location</small><span>${esc(e.venue||'TBA')}, ${esc(e.city||'India')}</span></div><div class="meta-box"><small>Organiser</small><span>${esc(e.organiser?.orgName||e.organiser?.name||'Floox organiser')}</span></div><div class="meta-box"><small>Budget</small><span>${Number(e.budget)>0?'₹'+Number(e.budget).toLocaleString('en-IN'):'Not disclosed'}</span></div>`;document.getElementById('emTags').innerHTML=(e.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('');document.getElementById('emActions').innerHTML=logged()?'<button class="primary" onclick="toast(\'Open the organiser profile to send an enquiry.\')">Contact Organiser →</button>':'<a class="primary" href="floox-login.html" style="text-align:center">Sign in to connect →</a>';document.getElementById('eventModal').classList.add('show')}
function closeEvent(){document.getElementById('eventModal').classList.remove('show')}
async function like(ev,id,name){if(ev)ev.stopPropagation();if(!logged()){toast('🔒 Sign in to follow profiles');return}try{const d=await getJSON('/api/toggle-like',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({likedId:id})});if(d.liked)state.likes.add(id);else state.likes.delete(id);render();toast(d.liked?'❤️ Added to your likes':'🤍 Removed from your likes')}catch(e){toast(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;search()}));document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search()});document.getElementById('sort').addEventListener('change',render);document.getElementById('q').addEventListener('input',()=>{clearTimeout(window._searchTimer);window._searchTimer=setTimeout(search,400)});document.getElementById('city').addEventListener('input',()=>{clearTimeout(window._cityTimer);window._cityTimer=setTimeout(search,400)});document.getElementById('profileModal').addEventListener('click',e=>{if(e.target.id==='profileModal')closeModal()});document.getElementById('eventModal').addEventListener('click',e=>{if(e.target.id==='eventModal')closeEvent()});
(function init(){const p=new URLSearchParams(location.search);document.getElementById('q').value=p.get('q')||'';document.getElementById('city').value=p.get('city')||'';const type=p.get('type');if(['artist','event','organiser'].includes(type)){state.type=type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===type))}if(logged()){document.getElementById('navLogin').textContent='Dashboard';document.getElementById('navLogin').href=(JSON.parse(localStorage.getItem('floox_user')||'{}').role==='artist'?'floox-dashboard-artist.html':JSON.parse(localStorage.getItem('floox_user')||'{}').role==='organiser'?'floox-dashboard-organiser.html':'floox-dashboard-fan.html');document.getElementById('navJoin').textContent='Sign Out';document.getElementById('navJoin').href='#';document.getElementById('navJoin').onclick=e=>{e.preventDefault();localStorage.removeItem('floox_token');localStorage.removeItem('floox_user');location.reload()}}loadLikes().then(search);setInterval(search,20000)})();

\n<script>\n(function(){\n  function polishPlanner(){\n    if(document.querySelector('.floox-planner')) return true;\n    const nodes=[...document.querySelectorAll('h1,h2,h3,h4,p,div')];\n    const heading=nodes.find(el=>{\n      const t=(el.textContent||'').replace(/\\s+/g,' ').trim();\n      return t.startsWith('Plan the event, then find the talent');\n    });\n    if(!heading) return false;\n    let box=heading.parentElement;\n    if(!box) return false;\n    box.classList.add('floox-planner');\n    return true;\n  }\n  if(!polishPlanner()){\n    const observer=new MutationObserver(function(){if(polishPlanner()) observer.disconnect()});\n    observer.observe(document.documentElement,{childList:true,subtree:true});\n    setTimeout(()=>observer.disconnect(),10000);\n  }\n})();\n</script>\n</body></html>
