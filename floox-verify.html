<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email — Floox</title><link rel="stylesheet" href="floox-shared.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="width:min(520px,100%);padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.04)"><h1 style="margin:0 0 8px">Verify your email</h1><p style="color:#aaa">We sent a 6-digit code to <strong id="emailText"></strong>.</p><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456" style="width:100%;font-size:2rem;letter-spacing:.4em;text-align:center;padding:16px;margin:20px 0;border-radius:14px"><button id="verify" class="btn-fire" style="width:100%">Verify email</button><button id="resend" class="btn-ghost" style="width:100%;margin-top:10px">Resend code</button><p id="msg" style="min-height:24px;color:#aaa"></p></section></main><script src="floox-auth.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),email=(p.get('email')||'').trim().toLowerCase(),role=p.get('role')||'fan';document.getElementById('emailText').textContent=email;if(!email){location.href='floox-login.html';return}const msg=t=>document.getElementById('msg').textContent=t;document.getElementById('verify').onclick=async()=>{try{const r=await fetch('/api/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp:document.getElementById('otp').value,purpose:'registration'})});const d=await r.json();if(!r.ok)throw Error(d.error);if(d.token)FLOOX.saveSession(d.token,d.user);location.href=role==='artist'?'floox-dashboard-artist.html':role==='organiser'?'floox-dashboard-organiser.html':'floox-public.html'}catch(e){msg(e.message)}};document.getElementById('resend').onclick=async()=>{try{const r=await fetch('/api/resend-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,purpose:'registration'})});const d=await r.json();if(!r.ok)throw Error(d.error);msg(d.message)}catch(e){msg(e.message)}}})()</script></body></html>
