<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify your email — Floox</title>
<link rel="icon" href="logo_floox.jpeg">
<link rel="stylesheet" href="floox-shared.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <section style="width:min(520px,100%);padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.04)">
    <h1 style="margin:0 0 8px">Verify your email</h1>
    <p style="color:#aaa">We sent a 6-digit code to <strong id="emailText"></strong>.</p>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="width:100%;font-size:2rem;letter-spacing:.4em;text-align:center;padding:16px;margin:20px 0;border-radius:14px">
    <button id="verify" class="btn-fire" style="width:100%">Verify email</button>
    <button id="resend" class="btn-ghost" style="width:100%;margin-top:10px">Resend code</button>
    <p id="msg" style="min-height:24px;color:#aaa"></p>
  </section>
</main>
<script src="floox-auth.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const email = (params.get('email') || '').trim().toLowerCase();
  const role = (params.get('role') || 'fan').trim().toLowerCase();
  const emailEl = document.getElementById('emailText');
  const otpEl = document.getElementById('otp');
  const verifyBtn = document.getElementById('verify');
  const resendBtn = document.getElementById('resend');
  const msgEl = document.getElementById('msg');

  emailEl.textContent = email;

  if (!email || !email.includes('@')) {
    location.href = 'floox-login.html';
    return;
  }

  const dashboardForRole = () => {
    if (role === 'artist') return 'floox-dashboard-artist.html';
    if (role === 'organiser' || role === 'organizer') return 'floox-dashboard-organiser.html';
    return 'floox-dashboard-fan.html';
  };

  const setMessage = (text, type = 'info') => {
    msgEl.textContent = text;
    msgEl.style.color = type === 'error' ? '#ff6b9d' : type === 'success' ? '#4ade80' : '#aaa';
  };

  verifyBtn.onclick = async () => {
    const otp = otpEl.value.trim();
    if (!/^\d{6}$/.test(otp)) {
      setMessage('Please enter the 6-digit verification code.', 'error');
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verifying…';

    try {
      const data = await FLOOX.verifyOtp(email, otp, 'registration');
      setMessage('Email verified successfully. Redirecting…', 'success');
      setTimeout(() => {
        window.location.href = dashboardForRole();
      }, 450);
    } catch (err) {
      setMessage(err.message || 'Verification failed. Please try again.', 'error');
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify email';
    }
  };

  let resendBusy = false;
  resendBtn.onclick = async () => {
    if (resendBusy) return;
    resendBusy = true;
    resendBtn.disabled = true;
    resendBtn.textContent = 'Sending…';

    try {
      const data = await FLOOX.resendOtp(email, 'registration');
      setMessage(data.message || 'A new code has been sent.', 'success');
    } catch (err) {
      setMessage(err.message || 'Could not resend the code.', 'error');
    } finally {
      setTimeout(() => {
        resendBusy = false;
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      }, 1500);
    }
  };

  otpEl.addEventListener('input', () => {
    otpEl.value = otpEl.value.replace(/\D/g, '').slice(0, 6);
  });
})();
</script>
</body>
</html>
