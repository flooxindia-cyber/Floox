<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Floox</title>
<link rel="icon" href="logo_floox.jpeg">
<link rel="stylesheet" href="floox-shared.css">
<style>
:root{--o:#ff5c00;--p:#ff2d78;--ink:#100a02;--panel:#fff;--line:#eadfd4;--muted:#786f68;--soft:#f8f3ee}
*{box-sizing:border-box}body{margin:0;background:#f7f1ea;color:#211811;font-family:var(--body,'Cabinet Grotesk',sans-serif);min-height:100vh}.page{min-height:100vh;display:flex;flex-direction:column}.top{height:72px;background:rgba(255,251,246,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#211811;font-weight:900}.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover}.brand span{font:800 1.35rem var(--head,'Clash Display')}.top-right{display:flex;gap:8px;align-items:center}.top-link{border:1px solid var(--line);border-radius:100px;padding:9px 14px;text-decoration:none;color:#5f554e;font-size:.74rem;font-weight:800}.top-link:hover{border-color:var(--o);color:var(--o)}.shell{width:min(1180px,94%);margin:26px auto 40px;flex:1}.heading{margin-bottom:18px}.heading h1{font:800 clamp(2rem,4vw,3.2rem)/1 var(--head,'Clash Display');margin:0;letter-spacing:-1.5px}.heading p{margin:7px 0 0;color:var(--muted);font-size:.82rem}.messenger{height:min(720px,calc(100vh - 160px));min-height:560px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:330px 1fr;box-shadow:0 18px 55px rgba(43,24,8,.08)}.inbox{border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff}.inbox-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.inbox-title{font:800 1rem var(--head,'Clash Display')}.refresh{border:0;background:var(--soft);border-radius:10px;padding:7px 9px;cursor:pointer;color:#5f554e}.search{padding:11px 13px;border-bottom:1px solid var(--line)}.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#faf7f3;outline:none;font-size:.75rem}.search input:focus{border-color:rgba(255,92,0,.45)}.conversations{overflow:auto;flex:1}.conv{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid #f2ebe4;cursor:pointer;transition:.16s}.conv:hover{background:#fbf7f3}.conv.active{background:#fff1e9}.avatar{width:43px;height:43px;border-radius:13px;flex:0 0 43px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--o),var(--p));color:#fff;font:800 .82rem var(--head,'Clash Display')}.avatar img{width:100%;height:100%;object-fit:cover}.conv-copy{min-width:0;flex:1}.conv-top{display:flex;gap:8px;align-items:center;justify-content:space-between}.conv-name{font:800 .76rem var(--head,'Clash Display');white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv-time{font-size:.57rem;color:#a1978f;white-space:nowrap}.conv-preview{font-size:.65rem;color:#81776f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:100px;align-items:center;justify-content:center;background:var(--o);color:#fff;font-size:.56rem;font-weight:900}.empty-list{padding:40px 20px;text-align:center;color:#9a9088;font-size:.72rem;line-height:1.7}.chat{display:flex;flex-direction:column;min-width:0;background:#fff}.chat-head{min-height:72px;padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.chat-head-copy{min-width:0}.chat-name{font:800 .95rem var(--head,'Clash Display')}.chat-meta{font-size:.65rem;color:#8a8078;margin-top:2px}..chat-actions{margin-left:auto}.profile-link{font-size:.65rem;font-weight:800;color:var(--o);text-decoration:none}.messages{flex:1;overflow:auto;padding:22px;background:linear-gradient(180deg,#fcf8f4,#fff)}.day{text-align:center;color:#aaa097;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 18px}.bubble-row{display:flex;margin:8px 0}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(72%,560px);padding:11px 13px;border-radius:16px;background:#f0ebe6;color:#342b25;font-size:.73rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:linear-gradient(135deg,var(--o),var(--p));color:#fff;border-bottom-right-radius:5px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}.bubble-meta{font-size:.53rem;opacity:.58;margin-top:5px}.event-chip{margin-top:7px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.12);font-size:.58rem;line-height:1.5}.bubble-row:not(.mine) .event-chip{background:#e7dfd7}.composer{padding:13px 15px;border-top:1px solid var(--line);background:#fff}.composer-top{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.composer input,.composer textarea{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#faf7f3;outline:none;font-size:.7rem;color:#342b25}.composer textarea{width:100%;min-height:66px;resize:none}.composer input:focus,.composer textarea:focus{border-color:rgba(255,92,0,.45)}.send-row{display:flex;align-items:center;gap:10px;margin-top:7px}.status{flex:1;font-size:.62rem;color:#8b8078;min-height:17px}.send{border:0;border-radius:12px;padding:10px 17px;background:linear-gradient(135deg,var(--o),var(--p));color:#fff;font:800 .7rem var(--head,'Clash Display');cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}.blank{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:#8c8178}.blank-icon{font-size:3rem}.blank h2{font:800 1.35rem var(--head,'Clash Display');color:#30271f;margin:10px 0 4px}.blank p{font-size:.72rem;max-width:360px;line-height:1.7}.notice{display:none;margin:15px auto;padding:12px 15px;border-radius:12px;background:#fff0e9;color:#a23d0b;border:1px solid #ffd6c1;font-size:.7rem}.notice.show{display:block}@media(max-width:800px){.messenger{grid-template-columns:1fr;height:calc(100vh - 130px);min-height:500px}.inbox{display:none}.inbox.mobile-open{display:flex}.chat{display:flex}.composer-top{grid-template-columns:1fr}.bubble{max-width:86%}.top-link.hide-mobile{display:none}}
</style>
</head>
<body>
<div class="page">
<header class="top"><a class="brand" href="floox-public.html"><img src="logo_floox.jpeg" alt="Floox"><span>Floox</span></a><div class="top-right"><a class="top-link hide-mobile" href="floox-search-results.html">Discover</a><a class="top-link" href="floox-public.html">Back to Floox</a></div></header>
<main class="shell">
  <div class="heading"><h1>Messages</h1><p>Connect directly with artists, organisers and other verified Floox members.</p></div>
  <div class="notice" id="notice"></div>
  <section class="messenger">
    <aside class="inbox" id="inbox"><div class="inbox-head"><div class="inbox-title">Conversations</div><button class="refresh" id="refresh" title="Refresh">↻</button></div><div class="search"><input id="convSearch" placeholder="Search conversations..."></div><div class="conversations" id="conversations"><div class="empty-list">Loading conversations…</div></div></aside>
    <section class="chat" id="chat"><div class="blank"><div><div class="blank-icon">💬</div><h2>Your Floox inbox</h2><p>Select a conversation to continue, or open an artist/organiser profile and send an enquiry to start one.</p></div></div></section>
  </section>
</main>
</div>
<script>
(function(){
'use strict';
const API='/api';
const token=()=>localStorage.getItem('floox_token');
const me=()=>{try{return JSON.parse(localStorage.getItem('floox_user')||'null')}catch{return null}};
const logged=()=>!!token()&&!!me();
if(!logged()){location.href='floox-login.html?from=messages';return;}
const withId=new URLSearchParams(location.search).get('with');
if(!logged()){location.href='floox-login.html?from=messages'+(withId?'&with='+encodeURIComponent(withId):'');return;}
const state={conversations:[],activeId:withId,messages:[],poll:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'F').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'F';
const nameOf=u=>u?.name||'Floox user';
const fmtTime=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))return'';return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
const fmtDate=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))return'';const now=new Date();const same=d.toDateString()===now.toDateString();if(same)return fmtTime(v);return d.toLocaleDateString([], {day:'2-digit',month:'short'});};
async function api(path,opts={}){const headers={'Accept':'application/json',...(opts.body?{'Content-Type':'application/json'}:{})};headers.Authorization='Bearer '+token();const r=await fetch(API+'/'+path,{...opts,headers});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(r.status===401){localStorage.removeItem('floox_token');localStorage.removeItem('floox_user');location.href='floox-login.html?from=messages';throw new Error('Session expired.');}if(!r.ok)throw new Error(d.error||d.message||'Request failed.');return d;}
function notice(msg){$('notice').textContent=msg;$('notice').classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>$('notice').classList.remove('show'),4500);}
function avatar(u){return u?.avatar?`<div class="avatar"><img src="${esc(u.avatar)}" alt=""></div>`:`<div class="avatar">${esc(initials(nameOf(u)))}</div>`;}
function renderConversations(){const q=String($('convSearch').value||'').toLowerCase().trim();const list=state.conversations.filter(c=>!q||nameOf(c.user).toLowerCase().includes(q));if(!list.length){$('conversations').innerHTML='<div class="empty-list">No conversations yet.<br>Visit a profile and send an enquiry to start connecting.</div>';return}$('conversations').innerHTML=list.map(c=>`<div class="conv ${state.activeId===c.user.id?'active':''}" data-id="${esc(c.user.id)}">${avatar(c.user)}<div class="conv-copy"><div class="conv-top"><div class="conv-name">${esc(nameOf(c.user))}</div><div class="conv-time">${esc(fmtDate(c.lastMessage?.createdAt))}</div></div><div class="conv-preview">${esc(c.lastMessage?.body||'No messages yet')}</div>${c.unread?`<div style="margin-top:5px"><span class="unread">${c.unread}</span></div>`:''}</div></div>`).join('');document.querySelectorAll('.conv').forEach(el=>el.onclick=()=>openConversation(el.dataset.id));}
function renderChat(participant){if(!participant){$('chat').innerHTML='<div class="blank"><div><div class="blank-icon">💬</div><h2>Conversation unavailable</h2><p>This member could not be found.</p></div></div>';return;}$('chat').innerHTML=`<div class="chat-head">${avatar(participant)}<div class="chat-head-copy"><div class="chat-name">${esc(nameOf(participant))}${participant.verified?' ✓':''}</div><div class="chat-meta">${esc(participant.role||'Floox member')}${participant.city?' · '+esc(participant.city):''}</div></div><div class="chat-actions"><a class="profile-link" href="floox-search-results.html?profile=${encodeURIComponent(participant.id)}">View profile →</a></div></div><div class="messages" id="messageList"></div><form class="composer" id="composer"><div class="composer-top"><input id="subject" maxlength="200" placeholder="Subject (optional)"><input id="eventType" maxlength="100" placeholder="Event type (optional)"></div><textarea id="body" maxlength="2000" minlength="10" placeholder="Write a message…" required></textarea><div class="send-row"><div class="status" id="sendStatus"></div><button class="send" id="sendBtn" type="submit">Send message →</button></div></form>`;renderMessages();$('composer').onsubmit=sendMessage;}
function renderMessages(){const box=$('messageList');if(!box)return;if(!state.messages.length){box.innerHTML='<div class="blank" style="height:100%"><div><div class="blank-icon" style="font-size:2rem">👋</div><h2>Start the conversation</h2><p>Say hello and tell them what you are looking for.</p></div></div>';return;}box.innerHTML=state.messages.map(m=>{const mine=m.senderId===me().id;const event=m.eventDate||m.eventType||m.budget;return `<div class="bubble-row ${mine?'mine':''}"><div class="bubble">${esc(m.body)}${event?`<div class="event-chip">${m.eventDate?'📅 '+esc(m.eventDate)+' ':''}${m.eventType?' · '+esc(m.eventType):''}${m.budget?' · '+esc(m.budget):''}</div>`:''}<div class="bubble-meta">${mine?'You':esc(m.sender?.name||'Floox member')} · ${esc(fmtTime(m.createdAt))}</div></div></div>`;}).join('');box.scrollTop=box.scrollHeight;}
async function loadInbox(){try{const d=await api('messages?limit=300');state.conversations=d.conversations||[];if(!state.activeId&&state.conversations[0])state.activeId=state.conversations[0].user.id;renderConversations();if(state.activeId)await openConversation(state.activeId,true);}catch(e){notice(e.message);$('conversations').innerHTML='<div class="empty-list">Could not load your inbox.</div>';}}
async function openConversation(id,silent=false){state.activeId=id;renderConversations();try{const d=await api('messages?with='+encodeURIComponent(id)+'&limit=300');state.messages=d.messages||[];renderChat(d.participant);await api('mark-messages-read',{method:'POST',body:JSON.stringify({senderId:id})});if(!silent)history.replaceState(null,'',location.pathname+'?with='+encodeURIComponent(id));await loadConversationListOnly();}catch(e){if(!silent)notice(e.message);}}
async function loadConversationListOnly(){try{const d=await api('messages?limit=300');state.conversations=d.conversations||[];renderConversations();}catch(e){}}
async function sendMessage(ev){ev.preventDefault();const body=$('body').value.trim();if(body.length<10){$('sendStatus').textContent='Please write at least 10 characters.';return;}const btn=$('sendBtn');btn.disabled=true;$('sendStatus').textContent='Sending…';try{const d=await api('send-message',{method:'POST',body:JSON.stringify({receiverId:state.activeId,subject:$('subject').value.trim()||'Direct message',body,eventType:$('eventType').value.trim()})});$('sendStatus').textContent=d.message||'Message sent.';$('body').value='';$('subject').value='';$('eventType').value='';await openConversation(state.activeId,true);}catch(e){$('sendStatus').textContent=e.message||'Could not send message.';}finally{btn.disabled=false;}}
$('refresh').onclick=()=>loadInbox();$('convSearch').oninput=renderConversations;
loadInbox();state.poll=setInterval(async()=>{if(document.hidden)return;try{const d=await api('messages?limit=300');state.conversations=d.conversations||[];renderConversations();if(state.activeId){const c=await api('messages?with='+encodeURIComponent(state.activeId)+'&limit=300');state.messages=c.messages||[];if($('messageList'))renderMessages();else renderChat(c.participant);await api('mark-messages-read',{method:'POST',body:JSON.stringify({senderId:state.activeId})});}}catch(e){}} ,5000);
window.addEventListener('beforeunload',()=>clearInterval(state.poll));
})();
</script>
</body>
</html>
